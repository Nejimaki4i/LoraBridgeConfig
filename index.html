<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор конфигурации cfg_t</title>
    <!-- Подключаем Tailwind CSS для красивого интерфейса -->
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-2xl border border-slate-700">
        <h1 class="text-2xl font-bold mb-2 text-indigo-400">Генератор бинарного файла конфигурации</h1>
        <p class="text-sm text-slate-400 mb-6">Заполните поля структуры <code class="bg-slate-900 px-1.5 py-0.5 rounded text-amber-400">cfg_t (packed, 32 bytes)</code></p>
        
        <form id="configForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- ID (uint32_t) -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">ID (uint32_t)</label>
                <input type="number" id="ID" min="0" max="4294967295" value="1" required
                       class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-indigo-500">
            </div>

            <!-- Troom (float) -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Troom (float)</label>
                <input type="number" id="Troom" step="any" value="23.5" required
                       class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-indigo-500">
            </div>

            <!-- VatTroom (float) -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">VatTroom (float)</label>
                <input type="number" id="VatTroom" step="any" value="1.2" required
                       class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-indigo-500">
            </div>

            <!-- tx_power (int32_t) -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">tx_power (int32_t)</label>
                <input type="number" id="tx_power" min="-2147483648" max="2147483647" value="14" required
                       class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-indigo-500">
            </div>

            <!-- freq (uint32_t) -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">freq (uint32_t)</label>
                <input type="number" id="freq" min="0" max="4294967295" value="868000000" required
                       class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-indigo-500">
            </div>

            <!-- sf (uint16_t) -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">sf (uint16_t - LoRa SF)</label>
                <input type="number" id="sf" min="0" max="65535" value="7" required
                       class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-indigo-500">
            </div>

            <!-- bw (uint16_t) -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">bw (uint16_t - LoRa BW)</label>
                <input type="number" id="bw" min="0" max="65535" value="125" required
                       class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-indigo-500">
            </div>

            <!-- cr (uint16_t) -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">cr (uint16_t - LoRa CR)</label>
                <input type="number" id="cr" min="0" max="65535" value="1" required
                       class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-indigo-500">
            </div>

            <!-- reserved (uint16_t) -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">reserved (uint16_t)</label>
                <input type="number" id="reserved" min="0" max="65535" value="0" required
                       class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-indigo-500">
            </div>

            <!-- srcID (uint32_t) -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">srcID (uint32_t)</label>
                <input type="number" id="srcID" min="0" max="4294967295" value="100" required
                       class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-indigo-500">
            </div>

            <!-- Кнопка генерации -->
            <div class="md:col-span-2 mt-4">
                <button type="button" onclick="generateBinary()" 
                        class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-4 rounded-xl transition duration-200 cursor-pointer shadow-lg shadow-indigo-600/20">
                    Сгенерировать и скачать .bin
                </button>
            </div>
        </form>
    </div>

    <script>
        function generateBinary() {
            const form = document.getElementById('configForm');
            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            // 1. Создаем буфер строго на 32 байта
            const buffer = new ArrayBuffer(32);
            const view = new DataView(buffer);

            // 2. Считываем значения из формы
            const id = parseInt(document.getElementById('ID').value);
            const troom = parseFloat(document.getElementById('Troom').value);
            const vatTroom = parseFloat(document.getElementById('VatTroom').value);
            const txPower = parseInt(document.getElementById('tx_power').value);
            const freq = parseInt(document.getElementById('freq').value);
            const sf = parseInt(document.getElementById('sf').value);
            const bw = parseInt(document.getElementById('bw').value);
            const cr = parseInt(document.getElementById('cr').value);
            const reserved = parseInt(document.getElementById('reserved').value);
            const srcId = parseInt(document.getElementById('srcID').value);

            // 3. Пакуем данные согласно смещениям (формат Little-Endian: true)
            view.setUint32(0,  id,       true); // 0-3 байты
            view.setFloat32(4, troom,    true); // 4-7 байты
            view.setFloat32(8, vatTroom, true); // 8-11 байты
            view.setInt32(12,  txPower,  true); // 12-15 байты
            view.setUint32(16, freq,     true); // 16-19 байты
            view.setUint16(20, sf,       true); // 20-21 байты
            view.setUint16(22, bw,       true); // 22-23 байты
            view.setUint16(24, cr,       true); // 24-25 байты
            view.setUint16(26, reserved, true); // 26-27 байты
            view.setUint32(28, srcId,    true); // 28-31 байты

            // 4. Создаем Blob и скачиваем его
            const blob = new Blob([buffer], { type: 'application/octet-stream' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'config.bin';
            
            // Инициируем скачивание
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);
        }
    </script>
</body>
</html>
